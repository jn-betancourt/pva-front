[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy inverso hacia Azure App Service para evitar CORS en modo Proxy (/api/v1)
[[redirects]]
  from = "/api/*"
  to = "https://pva-awd3d3bmcrbre3et.westus3-01.azurewebsites.net/api/:splat"
  status = 200
  force = true

# Proxy inverso para el healthcheck de Spring Boot Actuator en Azure
[[redirects]]
  from = "/actuator/*"
  to = "https://pva-awd3d3bmcrbre3et.westus3-01.azurewebsites.net/actuator/:splat"
  status = 200
  force = true

# Fallback SPA para React Router (evita 404 al recargar rutas como /pos, /inventario, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
